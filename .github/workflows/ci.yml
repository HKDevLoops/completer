name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# The test harness needs only bash, sh, grep, find and coreutils. Authoritative
# jobs (native + mainstream glibc containers) must be green. Exotic systems
# with no GitHub-hosted runner / official public image are best-effort and are
# documented rather than allowed to block a release.

jobs:
  native:
    name: native (${{ matrix.t }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {t: debian, os: ubuntu-latest}
          - {t: macos, os: macos-latest}
          - {t: windows, os: windows-latest}
    steps:
      - uses: actions/checkout@v4
      - name: Run test harness
        shell: bash
        run: bash tests/run-tests.sh
      - name: PowerShell parser check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('completer.ps1', [ref]$null, [ref]$e)
          [void][System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'PowerShell parse OK'

  containers:
    name: container (${{ matrix.t }})
    runs-on: ubuntu-latest
    container: ${{ matrix.img }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - t: arch
            img: archlinux:latest
            pm: 'pacman -Syu --noconfirm bash coreutils grep findutils git ca-certificates'
          - t: fedora
            img: fedora:latest
            pm: 'dnf -y install bash coreutils grep findutils git ca-certificates'
          - t: rpm
            img: fedora:latest
            pm: 'dnf -y install bash coreutils grep findutils git ca-certificates'
          - t: redhat-rocky
            img: rockylinux:9
            pm: 'dnf -y install bash grep findutils git ca-certificates'
          - t: redhat-alma
            img: almalinux:9
            pm: 'dnf -y install bash grep findutils git ca-certificates'
          - t: redhat-ubi
            img: redhat/ubi9:latest
            pm: 'dnf -y install bash grep findutils git ca-certificates'
          - t: suse
            img: opensuse/leap:15.6
            pm: 'zypper --non-interactive install bash coreutils grep findutils git ca-certificates'
    steps:
      # Install before checkout: minimal images lack git and CA certificates.
      - name: Install test dependencies (${{ matrix.t }})
        shell: sh
        run: ${{ matrix.pm }}
      - uses: actions/checkout@v4
      - name: Run test harness
        shell: bash
        run: bash tests/run-tests.sh

  # No GitHub-hosted runner and no official public image that also carries the
  # Node runtime actions/checkout needs. Kept visible and non-blocking; see
  # research/folder-layout-RESEARCH.md for the documented limitations.
  exotic:
    name: best-effort (${{ matrix.t }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {t: gentoo, img: gentoo/stage3:latest}
          - {t: nix, img: nixos/nix:latest}
          - {t: guix, img: debian:bookworm}
    steps:
      - uses: actions/checkout@v4
      - name: Run harness in ${{ matrix.t }} image
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint /bin/sh ${{ matrix.img }} \
            -c 'bash tests/run-tests.sh' || \
          echo "::warning::${{ matrix.t }} could not run the harness in its image; documented limitation"
