name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run test harness (bash/sh)
        if: runner.os == 'Linux'
        run: bash tests/run-tests.sh

      - name: Run test harness (Git Bash on Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tests/run-tests.sh

      - name: PowerShell parser check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "completer.ps1", [ref]$null, [ref]$e) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "PowerShell parse OK"
