name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# Structural + native-parser tests across the distros/oses the project targets.
# The harness needs only bash, sh, grep, find and coreutils — all installed below.
jobs:
  linux-containers:
    name: test (${{ matrix.t }})
    runs-on: ubuntu-latest
    container: ${{ matrix.img }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - t: debian
            img: debian:bookworm-slim
            pm: 'apt-get update && apt-get install -y --no-install-recommends bash coreutils grep findutils git'
          - t: arch
            img: archlinux:latest
            pm: 'pacman -Syu --noconfirm bash coreutils grep findutils git'
          - t: fedora
            img: fedora:latest
            pm: 'dnf -y install bash coreutils grep findutils git'
          - t: rpm
            img: fedora:latest
            pm: 'dnf -y install bash coreutils grep findutils git'
          - t: redhat-rocky
            img: rockylinux:9
            pm: 'dnf -y install bash coreutils grep findutils git'
          - t: redhat-alma
            img: almalinux:9
            pm: 'dnf -y install bash coreutils grep findutils git'
          - t: redhat-ubi
            img: redhat/ubi9:latest
            pm: 'microdnf install -y bash coreutils grep findutils git'
          - t: suse
            img: opensuse/leap:15.6
            pm: 'zypper --non-interactive install bash coreutils grep findutils git'
          - t: gentoo
            img: gentoo/stage3:latest
            pm: 'emerge --sync && emerge -q app-shells/bash sys-apps/coreutils sys-apps/grep sys-apps/findutils'
          - t: nix
            img: nixos/nix:latest
            pm: 'nix-channel --update; nix-env -iA nixpkgs.bash nixpkgs.coreutils nixpkgs.gnugrep nixpkgs.findutils'
          - t: guix
            img: debian:bookworm
            pm: 'apt-get update && apt-get install -y guix git && guix pull && guix install bash coreutils grep findutils'
    steps:
      # Install before checkout: minimal container images lack git, which
      # actions/checkout needs. The pm command installs git plus test tools.
      - name: Install test dependencies (${{ matrix.t }})
        shell: sh
        run: ${{ matrix.pm }}
      - uses: actions/checkout@v4
      - name: Run test harness
        shell: bash
        run: bash tests/run-tests.sh

  native:
    name: test (${{ matrix.t }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - t: macos
            os: macos-14
          - t: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test harness
        shell: bash
        run: bash tests/run-tests.sh
      - name: PowerShell parser check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "completer.ps1", [ref]$null, [ref]$e) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "PowerShell parse OK"
